services:
  postgres:
    image: postgres:16-alpine
    container_name: pipeline_csv_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-data_platform}
      POSTGRES_USER: ${POSTGRES_USER:-data_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-data_password_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-data_user} -d ${POSTGRES_DB:-data_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
